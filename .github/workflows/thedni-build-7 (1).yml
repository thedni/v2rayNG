        +
        +// Rough continent blobs (centre and radii in map space, 0..1) used to draw the dotted world map.
        +private class MapBlob(val cx: Float, val cy: Float, val rx: Float, val ry: Float)
        +
        +private val mapBlobs = listOf(
        +    MapBlob(0.20f, 0.22f, 0.10f, 0.17f),
        +    MapBlob(0.20f, 0.41f, 0.04f, 0.08f),
        +    MapBlob(0.31f, 0.69f, 0.05f, 0.21f),
        +    MapBlob(0.53f, 0.19f, 0.07f, 0.11f),
        +    MapBlob(0.54f, 0.54f, 0.08f, 0.25f),
        +    MapBlob(0.73f, 0.23f, 0.19f, 0.19f),
        +    MapBlob(0.76f, 0.46f, 0.10f, 0.10f),
        +    MapBlob(0.61f, 0.39f, 0.04f, 0.07f),
        +    MapBlob(0.87f, 0.77f, 0.07f, 0.09f),
        +)
        +
        +private const val MAP_COLS = 140
        +private const val MAP_ROWS = 76
        +
        +private val worldDots: List<Offset> = buildList {
        +    for (r in 0 until MAP_ROWS) {
        +        for (c in 0 until MAP_COLS) {
        +            val nx = (c + 0.5f) / MAP_COLS
        +            val ny = (r + 0.5f) / MAP_ROWS
        +            val inside = mapBlobs.any { b ->
        +                val dx = (nx - b.cx) / b.rx
        +                val dy = (ny - b.cy) / b.ry
        +                dx * dx + dy * dy <= 1f
        +            }
        +            if (inside) add(Offset(nx, ny))
        +        }
        +    }
        +}
        +
        +private fun DrawScope.drawWorld(
        +    color: Color,
        +    zoom: Float,
        +    fx: Float,
        +    fy: Float,
        +    country: CountryPoint?,
        +    highlight: Float
        +) {
        +    val w = size.width
        +    val h = size.height
        +    val radius = 1.2.dp.toPx() * kotlin.math.sqrt(zoom)
        +    for (p in worldDots) {
        +        val sx = ((p.x - fx) * zoom + 0.5f) * w
        +        val sy = ((p.y - fy) * zoom + 0.5f) * h
        +        if (sx < 0f || sx > w || sy < 0f || sy > h) continue
        +        drawCircle(color = color.copy(alpha = 0.28f), radius = radius, center = Offset(sx, sy))
        +    }
        +    if (country != null && highlight > 0f) {
        +        // Country area: a disc of bright dots around its centre (approximate, not the real border).
        +        val step = 1.7f
        +        var dLat = -country.radius
        +        while (dLat <= country.radius) {
        +            var dLon = -country.radius
        +            while (dLon <= country.radius) {
        +                if (dLat * dLat + dLon * dLon <= country.radius * country.radius) {
        +                    val nx = (country.lon + dLon + 170f) / 350f
        +                    val ny = (75f - (country.lat + dLat)) / 130f
        +                    val sx = ((nx - fx) * zoom + 0.5f) * w
        +                    val sy = ((ny - fy) * zoom + 0.5f) * h
        +                    if (sx in 0f..w && sy in 0f..h) {
        +                        drawCircle(
        +                            color = color.copy(alpha = 0.9f * highlight),
        +                            radius = radius * 1.25f,
        +                            center = Offset(sx, sy)
        +                        )
        +                    }
        +                }
        +                dLon += step
        +            }
        +            dLat += step
        +        }
        +    }
        +}
        +
        +/** Number of lit bars (0..3) for a measured delay; 0 means failed or untested. */
        +internal fun pingLevel(delayMillis: Long): Int = when {
        +    delayMillis <= 0L -> 0
        +    delayMillis < 300L -> 3
        +    delayMillis < 800L -> 2
        +    else -> 1
        +}
        +
        +@Composable
        +internal fun SignalBars(level: Int, color: Color, modifier: Modifier = Modifier) {
        +    val off = MaterialTheme.colorScheme.outlineVariant
        +    Row(
        +        modifier = modifier,
        +        verticalAlignment = Alignment.Bottom,
        +        horizontalArrangement = Arrangement.spacedBy(2.dp)
        +    ) {
        +        for (i in 0 until 3) {
        +            Box(
        +                Modifier
        +                    .width(4.dp)
        +                    .height((7 + i * 5).dp)
        +                    .clip(RoundedCornerShape(1.5.dp))
        +                    .background(if (i < level) color else off)
        +            )
        +        }
        +    }
        +}
        +
        +@Composable
        +fun ConnectHero(
        +    isRunning: Boolean,
        +    displayText: String,
        +    serverName: String,
        +    onToggle: () -> Unit,
        +    onTest: () -> Unit,
        +    modifier: Modifier = Modifier
        +) {
        +    val country = remember(serverName) { detectCountry(serverName) }
        +    val zoom by animateFloatAsState(if (country != null) 2.3f else 1f, tween(700), label = "map-zoom")
        +    val focusX by animateFloatAsState(country?.nx ?: 0.5f, tween(700), label = "map-fx")
        +    val focusY by animateFloatAsState(country?.ny ?: 0.5f, tween(700), label = "map-fy")
        +    val highlight by animateFloatAsState(if (country != null) 1f else 0f, tween(600), label = "map-hi")
        +    val primary = MaterialTheme.colorScheme.primary
        +    val secondary = MaterialTheme.colorScheme.secondary
        +    val transition = rememberInfiniteTransition(label = "hero-glow")
        +    val pulse = transition.animateFloat(
        +        initialValue = 0.45f,
        +        targetValue = 1f,
        +        animationSpec = infiniteRepeatable(tween(1600), RepeatMode.Reverse),
        +        label = "hero-pulse"
        +    )
        +    val toggleLabel = stringResource(if (isRunning) R.string.acc_stop else R.string.acc_start)
        +    val tapText = stringResource(if (isRunning) R.string.connect_tap_off else R.string.connect_tap_on)
        +
        +    Column(
        +        modifier = modifier
        +            .fillMaxWidth()
        +            .padding(horizontal = 16.dp),
        +        horizontalAlignment = Alignment.CenterHorizontally
        +    ) {
        +        Box(
        +            modifier = Modifier
        +                .fillMaxWidth()
        +                .height(190.dp),
        +            contentAlignment = Alignment.Center
        +        ) {
        +            Canvas(Modifier.fillMaxWidth().height(190.dp).clipToBounds()) {
        +                drawWorld(primary, zoom, focusX, focusY, country, highlight)
        +            }
        +            Canvas(Modifier.fillMaxWidth().height(190.dp).clipToBounds()) {
        +                if (country != null) {
        +                    val sx = ((country.nx - focusX) * zoom + 0.5f) * size.width
        +                    val sy = ((country.ny - focusY) * zoom + 0.5f) * size.height
        +                    val r = (10.dp.toPx() + 8.dp.toPx() * pulse.value)
        +                    drawCircle(color = primary.copy(alpha = 0.35f * (1f - pulse.value * 0.5f)), radius = r, center = Offset(sx, sy))
        +                    drawCircle(color = primary, radius = 3.dp.toPx(), center = Offset(sx, sy))
        +                }
        +            }
        +            Canvas(Modifier.size(190.dp)) {
        +                val glow = if (isRunning) pulse.value else 0.4f
        +                drawCircle(
        +                    brush = Brush.radialGradient(
        +                        colors = listOf(primary.copy(alpha = 0.40f * glow), Color.Transparent),
        +                        center = center,
        +                        radius = size.minDimension / 2f
        +                    ),
        +                    radius = size.minDimension / 2f
        +                )
        +            }
        +            Box(
        +                modifier = Modifier
        +                    .size(132.dp)
        +                    .clip(CircleShape)
        +                    .background(Color(0xFF0B0609))
        +                    .border(
        +                        width = 4.dp,
        +                        brush = Brush.linearGradient(listOf(primary, secondary, primary)),
        +                        shape = CircleShape
        +                    )
        +                    .clickable(role = Role.Button, onClick = onToggle)
        +                    .semantics { contentDescription = toggleLabel },
        +                contentAlignment = Alignment.Center
        +            ) {
        +                Column(horizontalAlignment = Alignment.CenterHorizontally) {
        +                    Icon(
        +                        painter = painterResource(R.drawable.ic_power_24dp),
        +                        contentDescription = null,
        +                        tint = if (isRunning) primary else Color.White,
        +                        modifier = Modifier.size(44.dp)
        +                    )
        +                    Spacer(Modifier.height(6.dp))
        +                    Text(
        +                        text = tapText,
        +                        style = MaterialTheme.typography.labelMedium,
        +                        color = MaterialTheme.colorScheme.onSurfaceVariant,
        +                        textAlign = TextAlign.Center
        +                    )
        +                }
        +            }
        +        }
        +
        +        Spacer(Modifier.height(10.dp))
        +
        +        Row(
        +            modifier = Modifier
        +                .fillMaxWidth()
        +                .clip(RoundedCornerShape(24.dp))
        +                .background(MaterialTheme.colorScheme.surfaceContainer)
        +                .border(1.dp, MaterialTheme.colorScheme.outlineVariant, RoundedCornerShape(24.dp))
        +                .padding(start = 18.dp, end = 4.dp, top = 4.dp, bottom = 4.dp),
        +            verticalAlignment = Alignment.CenterVertically
        +        ) {
        +            SignalBars(
        +                level = if (isRunning) 3 else 1,
        +                color = if (isRunning) primary else MaterialTheme.colorScheme.onSurfaceVariant
        +            )
        +            Spacer(Modifier.width(14.dp))
        +            Text(
        +                text = displayText,
        +                modifier = Modifier.weight(1f),
        +                style = MaterialTheme.typography.bodyMedium,
        +                fontWeight = FontWeight.SemiBold,
        +                maxLines = 2,
        +                overflow = TextOverflow.Ellipsis
        +            )
        +            IconButton(onClick = onTest) {
        +                Icon(
        +                    painter = painterResource(R.drawable.ic_flash_on_24dp),
        +                    contentDescription = stringResource(R.string.connection_test_testing),
        +                    tint = primary
        +                )
        +            }
        +        }
        +    }
        +}
        +
        +@Composable
        +fun MainNavBar(onNavigate: (MainDestination) -> Unit) {
        +    Column(
        +        modifier = Modifier
        +            .fillMaxWidth()
        +            .background(MaterialTheme.colorScheme.surfaceContainerLowest)
        +            .windowInsetsPadding(WindowInsets.navigationBars)
        +    ) {
        +        AppDivider()
        +        Row(
        +            modifier = Modifier
        +                .fillMaxWidth()
        +                .height(62.dp)
        +        ) {
        +            NavItem(R.drawable.ic_home_24dp, R.string.nav_home, true) {}
        +            NavItem(R.drawable.ic_logcat_24dp, R.string.title_logcat, false) {
        +                onNavigate(MainDestination.Logcat)
        +            }
        +            NavItem(R.drawable.ic_settings_24dp, R.string.title_settings, false) {
        +                onNavigate(MainDestination.Settings)
        +            }
        +        }
        +    }
        +}
        +
        +@Composable
        +private fun RowScope.NavItem(
        +    iconRes: Int,
        +    labelRes: Int,
        +    selected: Boolean,
        +    onClick: () -> Unit
        +) {
        +    val tint = if (selected) MaterialTheme.colorScheme.primary else MaterialTheme.colorScheme.onSurfaceVariant
        +    Column(
        +        modifier = Modifier
        +            .weight(1f)
        +            .fillMaxHeight()
        +            .selectable(selected = selected, role = Role.Tab, onClick = onClick),
        +        horizontalAlignment = Alignment.CenterHorizontally,
        +        verticalArrangement = Arrangement.Center
        +    ) {
        +        Icon(
        +            painter = painterResource(iconRes),
        +            contentDescription = null,
        +            tint = tint,
        +            modifier = Modifier.size(24.dp)
        +        )
        +        Text(
        +            text = stringResource(labelRes),
        +            color = tint,
        +            fontSize = 12.sp,
        +            fontWeight = if (selected) FontWeight.SemiBold else FontWeight.Normal
        +        )
        +        Spacer(Modifier.height(4.dp))
        +        Box(
        +            Modifier
        +                .width(44.dp)
        +                .height(3.dp)
        +                .clip(RoundedCornerShape(2.dp))
        +                .background(if (selected) MaterialTheme.colorScheme.primary else Color.Transparent)
        +        )
        +    }
        +}
