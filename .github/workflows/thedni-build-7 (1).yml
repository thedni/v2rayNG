name: Build THEDNI APK 7

# Manual build: GitHub -> Actions -> "Build THEDNI APK 2" -> Run workflow.
# It renames the app label from v2rayNG to THEDNI, signs with a freshly
# generated key and uploads the APKs as a downloadable artifact.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        # Pinned to the v2.3.14 base that the patches below were written for.
        ref: aa4b05503a504a3f2e43818e6ee8ebf1caaa3df0
        submodules: 'recursive'
        fetch-depth: '0'

