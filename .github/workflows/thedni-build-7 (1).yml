        +package com.v2ray.ang.ui.main
        +
        +/** Approximate location of a country on the hero map (equirectangular, degrees). */
        +internal class CountryPoint(
        +    val code: String,
        +    val lat: Float,
        +    val lon: Float,
        +    val radius: Float,
        +    val keywords: List<String>,
        +) {
        +    /** Normalised map position, shared with the world dot map (lon -170..180, lat 75..-55). */
