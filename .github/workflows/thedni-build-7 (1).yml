        +)
        +
        +private val byCode = countries.associateBy { it.code }
        +
        +/**
        + * Guesses the country of a server from its name: a flag emoji first, then a known country
        + * word (English or Persian), then a standalone upper-case ISO code such as "US" or "DE".
        + */
        +internal fun detectCountry(name: String): CountryPoint? {
        +    if (name.isBlank()) return null
        +
        +    val points = ArrayList<Int>()
        +    var at = 0
        +    while (at < name.length) {
        +        val cp = name.codePointAt(at)
        +        points.add(cp)
        +        at += Character.charCount(cp)
        +    }
        +    for (i in 0 until points.size - 1) {
        +        val a = points[i] - 0x1F1E6
        +        val b = points[i + 1] - 0x1F1E6
        +        if (a in 0..25 && b in 0..25) {
        +            byCode["" + ('A' + a) + ('A' + b)]?.let { return it }
        +        }
        +    }
        +
        +    val lower = name.lowercase()
        +    countries.firstOrNull { country -> country.keywords.any { lower.contains(it) } }?.let { return it }
        +
        +    Regex("(?<![A-Za-z])[A-Z]{2}(?![A-Za-z])").findAll(name).forEach { match ->
        +        val code = if (match.value == "UK") "GB" else match.value
        +        byCode[code]?.let { return it }
        +    }
        +    return null
        +}
