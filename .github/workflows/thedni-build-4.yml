        GgnraaMyI4HCKomZ4x/KijfQ2jI2Q5i794ZRljlRzVY8+qlUsWRKVGSkPf/Dw7RmIiorpLjHQydsdy7LVGVqOTKlide68jAzUWG+
        8votqcfaeacILYx+0r3o4R/mDkG35uWTN/91xjtNKCLbZpds5v8Hkg4PhZD7CDgAAAAASUVORK5CYII=
        """

        if os.path.exists("logo.png"):
            logo = Image.open("logo.png").convert("RGBA")
            print("Using logo.png from the repository")
        else:
            mask = Image.open(io.BytesIO(base64.b64decode(LOGO_B64))).convert("L")
            text_w = 600
            mask = mask.resize((text_w, round(mask.height * text_w / mask.width)), Image.LANCZOS)
            ink = Image.new("RGBA", mask.size, (0, 0, 0, 255))
            ink.putalpha(mask)
            logo = Image.new("RGBA", (1024, 1024), (0, 0, 0, 0))
            logo.alpha_composite(ink, ((1024 - mask.width) // 2, (1024 - mask.height) // 2))
            print("Using the embedded THEDNI logo")

        def scaled(px):
            return logo.resize((px, px), Image.LANCZOS)

        for name, scale in DENSITY.items():
            folder = os.path.join(RES, "mipmap-" + name)
            # Adaptive icon foreground (108dp canvas); the logo keeps its own margin.
            scaled(round(108 * scale)).save(os.path.join(folder, "ic_launcher_foreground.png"))
            # Classic icons (48dp): the logo on a white background.
            px = round(48 * scale)
            flat = Image.new("RGBA", (px, px), (255, 255, 255, 255))
            flat.alpha_composite(scaled(px))
            flat.save(os.path.join(folder, "ic_launcher.png"))
            round_path = os.path.join(folder, "ic_launcher_round.png")
            if os.path.exists(round_path):
                flat.save(round_path)
        print("Launcher icons replaced")

        # Notification / status-bar icons: the "T" of the logo as a white silhouette.
        alpha = logo.split()[3]
        x0, y0, x1, y1 = alpha.getbbox()
        end = x1
        gap = False
        for x in range(x0, x1):
            ink = alpha.crop((x, 0, x + 1, alpha.height)).point(lambda v: 255 if v > 40 else 0).getbbox()
            if ink is None:
                gap = True
                end = x
                break
        glyph = alpha.crop((x0, y0, end, y1))
        glyph = glyph.crop(glyph.getbbox())
        side = max(glyph.size)
        sq = Image.new("L", (side, side), 0)
        sq.paste(glyph, ((side - glyph.width) // 2, (side - glyph.height) // 2))
        for name, scale in DENSITY.items():
            folder = os.path.join(RES, "drawable-" + name)
            px = round(24 * scale)
            inner = round(20 * scale)
            g = sq.resize((inner, inner), Image.LANCZOS)
            for icon, color in (("ic_stat_name", 255), ("ic_stat_proxy", 255), ("ic_stat_direct", 255), ("ic_stat_name_black", 0)):
                path = os.path.join(folder, icon + ".png")
                if not os.path.exists(path):
                    continue
                canvas = Image.new("L", (px, px), 0)
                canvas.paste(g, ((px - inner) // 2, (px - inner) // 2))
                out = Image.new("RGBA", (px, px), (color, color, color, 255))
                out.putalpha(canvas)
                out.save(path)
        print("Notification icons replaced (glyph width %d, separated=%s)" % (end - x0, gap))
        PY

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
      with:
        log-accepted-android-sdk-licenses: false
        cmdline-tools-version: '14742923'
        packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

    - name: Install NDK
      run: |
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
          --channel=0 \
          --install "ndk;30.0.16248370"
        echo "NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> $GITHUB_ENV
        sed -i '10i\
        \
            ndkVersion = "30.0.16248370"' ${{ github.workspace }}/V2rayNG/app/build.gradle.kts

    - name: Build libhevtun
      run: |
        bash compile-hevtun.sh

    - name: Copy libhevtun
      run: |
        cp -r ${{ github.workspace }}/libs ${{ github.workspace }}/V2rayNG/app

    - name: Fetch AndroidLibXrayLite tag
      run: |
        pushd AndroidLibXrayLite
        CURRENT_TAG=$(git describe --tags --abbrev=0)
        echo "Current tag in this repo: $CURRENT_TAG"
        echo "CURRENT_TAG=$CURRENT_TAG" >> $GITHUB_ENV
        popd

    - name: Download libv2ray
      uses: robinraju/release-downloader@v1.13
      with:
        repository: '2dust/AndroidLibXrayLite'
        tag: ${{ env.CURRENT_TAG }}
        fileName: 'libv2ray.aar'
        out-file-path: V2rayNG/app/libs/

    - name: Setup Java
      uses: actions/setup-java@v6.1.0
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Generate signing key
      run: |
        PASS=$(openssl rand -hex 16)
        echo "::add-mask::$PASS"
        keytool -genkeypair -keystore "$RUNNER_TEMP/thedni.jks" -alias thedni \
          -keyalg RSA -keysize 2048 -validity 10000 \
          -storepass "$PASS" -keypass "$PASS" -dname "CN=THEDNI"
        echo "KS_PASS=$PASS" >> $GITHUB_ENV

    - name: Build APK
      run: |
        cd ${{ github.workspace }}/V2rayNG
        echo "sdk.dir=${ANDROID_HOME}" > local.properties
        chmod 755 gradlew
        ./gradlew assembleRelease \
          -Pandroid.injected.signing.store.file=$RUNNER_TEMP/thedni.jks \
          -Pandroid.injected.signing.store.password=$KS_PASS \
          -Pandroid.injected.signing.key.alias=thedni \
          -Pandroid.injected.signing.key.password=$KS_PASS

    - name: Upload APKs
      uses: actions/upload-artifact@v7
      if: ${{ success() }}
      with:
        name: THEDNI-apk
        path: |
          ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/*/release/*arm64-v8a*.apk
          ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/*/release/*universal*.apk
