        +            text = percentText,
        +            style = MaterialTheme.typography.labelLarge,
        +            fontWeight = FontWeight.SemiBold,
        +            color = if (low) MaterialTheme.colorScheme.error else MaterialTheme.colorScheme.onSurface,
