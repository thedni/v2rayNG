        +/** Circular usage chart: a track ring with the used share drawn clockwise from the top. */
        +@Composable
        +private fun UsageRing(
        +    fraction: Float,
        +    percentText: String,
        +    low: Boolean,
        +    modifier: Modifier = Modifier,
        +) {
        +    val progressColor = if (low) MaterialTheme.colorScheme.error else MaterialTheme.colorScheme.primary
        +    val trackColor = MaterialTheme.colorScheme.surfaceVariant
        +    Box(modifier.size(RING_SIZE), contentAlignment = Alignment.Center) {
        +        Canvas(Modifier.fillMaxSize().clearAndSetSemantics {}) {
        +            val stroke = Stroke(width = RING_STROKE.toPx(), cap = StrokeCap.Round)
        +            val inset = stroke.width / 2f
        +            val topLeft = Offset(inset, inset)
        +            val arcSize = Size(size.width - stroke.width, size.height - stroke.width)
        +            drawArc(
        +                color = trackColor,
        +                startAngle = 0f,
        +                sweepAngle = 360f,
        +                useCenter = false,
        +                topLeft = topLeft,
        +                size = arcSize,
        +                style = stroke,
        +            )
        +            if (fraction > 0f) {
        +                drawArc(
        +                    color = progressColor,
        +                    startAngle = -90f,
        +                    sweepAngle = 360f * fraction,
        +                    useCenter = false,
        +                    topLeft = topLeft,
        +                    size = arcSize,
        +                    style = stroke,
        +                )
        +            }
        +        }
