name: Build THEDNI APK

# Manual build: GitHub -> Actions -> "Build THEDNI APK" -> Run workflow.
# It renames the app label from v2rayNG to THEDNI, signs with a freshly
# generated key and uploads the APKs as a downloadable artifact.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        submodules: 'recursive'
        fetch-depth: '0'

