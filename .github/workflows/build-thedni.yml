    - name: Rename app to THEDNI
      run: |
        find V2rayNG/app/src/main/res -name strings.xml -exec sed -i \
          -e 's|<string name="app_name" translatable="false">v2rayNG</string>|<string name="app_name" translatable="false">THEDNI</string>|' \
          -e 's|\(name="app_widget_name">\)v2rayNG<|\1THEDNI<|' \
          -e 's|\(name="app_tile_name">\)v2rayNG<|\1THEDNI<|' {} +
        sed -i 's/"v2rayNG_/"THEDNI_/g' V2rayNG/app/build.gradle.kts
        echo "Remaining app_name values:"
        grep -rh 'name="app_name"' V2rayNG/app/src/main/res | sort | uniq -c

    - name: Replace app icon with logo.png
      run: |
        if [ ! -f logo.png ]; then
          echo "No logo.png in the repository root, keeping the original icon."
          exit 0
        fi
        python3 -m venv "$RUNNER_TEMP/iconenv"
        "$RUNNER_TEMP/iconenv/bin/pip" install --quiet pillow
        "$RUNNER_TEMP/iconenv/bin/python" - <<'PY'
        import os
        from PIL import Image

        RES = "V2rayNG/app/src/main/res"
        DENSITY = {"mdpi": 1.0, "hdpi": 1.5, "xhdpi": 2.0, "xxhdpi": 3.0, "xxxhdpi": 4.0}
        logo = Image.open("logo.png").convert("RGBA")

        def scaled(px):
            return logo.resize((px, px), Image.LANCZOS)

        for name, scale in DENSITY.items():
            folder = os.path.join(RES, "mipmap-" + name)
            # Adaptive icon foreground (108dp canvas); logo.png keeps its own margin.
            scaled(round(108 * scale)).save(os.path.join(folder, "ic_launcher_foreground.png"))
            # Classic icons (48dp): the logo on a white background.
            px = round(48 * scale)
            flat = Image.new("RGBA", (px, px), (255, 255, 255, 255))
            flat.alpha_composite(scaled(px))
            flat.save(os.path.join(folder, "ic_launcher.png"))
            round_path = os.path.join(folder, "ic_launcher_round.png")
            if os.path.exists(round_path):
                flat.save(round_path)
        print("Launcher icons replaced with logo.png")
        PY

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
      with:
        log-accepted-android-sdk-licenses: false
        cmdline-tools-version: '14742923'
        packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

    - name: Install NDK
      run: |
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
          --channel=0 \
          --install "ndk;30.0.16248370"
        echo "NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> $GITHUB_ENV
        sed -i '10i\
        \
            ndkVersion = "30.0.16248370"' ${{ github.workspace }}/V2rayNG/app/build.gradle.kts

    - name: Build libhevtun
      run: |
        bash compile-hevtun.sh

    - name: Copy libhevtun
      run: |
        cp -r ${{ github.workspace }}/libs ${{ github.workspace }}/V2rayNG/app

    - name: Fetch AndroidLibXrayLite tag
      run: |
        pushd AndroidLibXrayLite
        CURRENT_TAG=$(git describe --tags --abbrev=0)
        echo "Current tag in this repo: $CURRENT_TAG"
        echo "CURRENT_TAG=$CURRENT_TAG" >> $GITHUB_ENV
        popd

    - name: Download libv2ray
      uses: robinraju/release-downloader@v1.13
      with:
        repository: '2dust/AndroidLibXrayLite'
        tag: ${{ env.CURRENT_TAG }}
        fileName: 'libv2ray.aar'
        out-file-path: V2rayNG/app/libs/

    - name: Setup Java
      uses: actions/setup-java@v6.1.0
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Generate signing key
      run: |
        PASS=$(openssl rand -hex 16)
        echo "::add-mask::$PASS"
        keytool -genkeypair -keystore "$RUNNER_TEMP/thedni.jks" -alias thedni \
          -keyalg RSA -keysize 2048 -validity 10000 \
          -storepass "$PASS" -keypass "$PASS" -dname "CN=THEDNI"
        echo "KS_PASS=$PASS" >> $GITHUB_ENV

    - name: Build APK
      run: |
        cd ${{ github.workspace }}/V2rayNG
        echo "sdk.dir=${ANDROID_HOME}" > local.properties
        chmod 755 gradlew
        ./gradlew assembleRelease \
          -Pandroid.injected.signing.store.file=$RUNNER_TEMP/thedni.jks \
          -Pandroid.injected.signing.store.password=$KS_PASS \
          -Pandroid.injected.signing.key.alias=thedni \
          -Pandroid.injected.signing.key.password=$KS_PASS

    - name: Upload APKs
      uses: actions/upload-artifact@v7
      if: ${{ success() }}
      with:
        name: THEDNI-apk
        path: |
          ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/*/release/*arm64-v8a*.apk
          ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/*/release/*universal*.apk
